name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  # Checks that the module imports cleanly against the system PyGObject
  # packages, catching syntax/import errors before a human has to notice
  # them. Uses the runner's system Python: `gi` is a C extension bound to
  # apt's libraries, so a setup-python interpreter cannot see it.
  import-check:
    name: Import check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0
      - name: Import clipboard module
        run: /usr/bin/python3 -c "import clipboard; print('import ok')"
