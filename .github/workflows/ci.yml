name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  # The GTK/PyGObject runtime is only guaranteed in a desktop image; this
  # checks that the module at least compiles and imports cleanly on Linux
  # with the system packages installed, catching syntax/import errors
  # before a human has to notice them.
  import-check:
    name: Import check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Import clipboard module
        run: python3 -c "import clipboard; print('import ok')"
