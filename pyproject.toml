[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntu-clipboard"
version = "0.1.0"
description = "A Windows-style clipboard history (Win+V) for Ubuntu GNOME — text and images, Wayland-friendly"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Lekhan11" }]
keywords = ["clipboard", "gnome", "wayland", "ubuntu", "linux", "history"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11",
    "Environment :: Wayland",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: File Managers",
]
# GTK/GLib come from the system (python3-gi, gir1.2-gtk-3.0) — see README.
dependencies = []

[project.scripts]
ubuntu-clipboard = "clipboard:main"

[tool.setuptools]
py-modules = ["clipboard"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W"]
# Keep line-length off: the module carries long explanatory comments.
ignore = ["E501"]
